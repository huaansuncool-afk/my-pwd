      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-fg: #DC2626;
      --success-bg: rgba(16, 185, 129, 0.14);
      --success-fg: #059669;
      --warn-bg: rgba(245, 158, 11, 0.16);
      --warn-fg: #B45309;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Full-bleed Liquid Glass Aurora Background */
    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(37, 99, 235, 0.42), transparent 48%),
        radial-gradient(circle at 82% 22%, rgba(124, 58, 237, 0.36), transparent 46%),
        radial-gradient(circle at 55% 68%, rgba(6, 182, 212, 0.32), transparent 52%),
        radial-gradient(circle at 22% 86%, rgba(14, 165, 233, 0.28), transparent 44%),
        linear-gradient(145deg, #050914 0%, #0B162C 50%, #070D1D 100%);
      transition: background 0.35s ease;
    }

    body.light .aurora-bg {
      background:
        radial-gradient(circle at 18% 18%, rgba(96, 165, 250, 0.42), transparent 50%),
        radial-gradient(circle at 84% 24%, rgba(167, 139, 250, 0.34), transparent 48%),
        radial-gradient(circle at 56% 64%, rgba(56, 189, 248, 0.30), transparent 52%),
        radial-gradient(circle at 24% 86%, rgba(45, 212, 191, 0.28), transparent 44%),
        linear-gradient(145deg, #E2EEFF 0%, #EFE7FF 50%, #DDF6FA 100%);
    }

    .app-shell {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 28px);
      display: flex;
      flex-direction: column;
    }

    .glass-panel {
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      border-top: 1.5px solid var(--glass-top);
      border-radius: 26px;
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      box-shadow: var(--shadow);
    }

    .hidden { display: none !important; }

    /* Unlock View */
    .unlock-wrap {
      margin: auto 0;
      padding: 28px 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand-badge {
      width: 66px;
      height: 66px;
      margin: 0 auto;
      border-radius: 20px;
      background: linear-gradient(135deg, #38BDF8, #2563EB 55%, #4F46E5);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.42);
      border: 1.5px solid rgba(255, 255, 255, 0.42);
    }

    .unlock-title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin: 2px 0 0;
      letter-spacing: -0.3px;
    }

    .unlock-sub {
      text-align: center;
      font-size: 12px;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 12px;
      border-radius: 999px;
      align-self: center;
      font-weight: 600;
    }

    .file-drop {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--glass-card);
      border: 1.5px dashed var(--glass-border);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .file-drop:active { transform: scale(0.985); }
    .file-drop.loaded {
      border-style: solid;
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .file-drop-ico {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--glass-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .file-drop-info { min-width: 0; flex: 1; }
    .file-drop-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-drop-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
    }

    .input-row {
      position: relative;
      display: flex;
      align-items: center;
    }

    .glass-input, .glass-select, .glass-textarea {
      width: 100%;
      background: var(--input-bg);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    .glass-input:focus, .glass-select:focus, .glass-textarea:focus {
      border-color: var(--accent);
    }

    .glass-textarea {
      min-height: 76px;
      resize: vertical;
    }

    .eye-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      min-height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 16px;
      background: var(--accent-btn);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.30);
      transition: transform 0.15s, opacity 0.2s;
    }

    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; }

    .btn-secondary {
      min-height: 40px;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      background: var(--glass-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      padding: 0 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-secondary:active { transform: scale(0.97); }

    .btn-danger {
      min-height: 40px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 14px;
      background: var(--danger-bg);
      color: var(--danger-fg);
      font-size: 13px;
      font-weight: 700;
      padding: 0 14px;
      cursor: pointer;
    }

    .unlock-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .error-banner {
      background: var(--danger-bg);
      color: var(--danger-fg);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .tip-box {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.55;
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 11px 13px;
    }

    /* Main Vault Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .top-brand-ico {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #38BDF8, #2563EB);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.38);
    }

    .top-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.15;
    }

    .top-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      border: 1px solid var(--glass-border);
      background: var(--glass-panel);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .icon-btn:active { transform: scale(0.94); }

    .top-btns {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Search & Filter Strip */
    .search-shell {
      position: sticky;
      top: calc(var(--safe-top) + 8px);
      z-index: 10;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      height: 40px;
      border-radius: 20px;
      padding: 0 14px;
      font-size: 14px;
      background: var(--glass-card);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
      outline: none;
    }

    .search-input:focus { border-color: var(--accent); }

    .add-pill {
      height: 40px;
      padding: 0 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: var(--accent-btn);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 2px;
      scrollbar-width: none;
    }
    .pill-strip::-webkit-scrollbar { display: none; }

    .cat-pill {
      flex-shrink: 0;
      height: 32px;
      padding: 0 12px;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: var(--glass-card);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .cat-pill.active {
      background: var(--accent-btn);
      color: #FFFFFF;
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* Entry Cards */
    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .entry-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 13px;
      border-radius: 20px;
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-top);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      cursor: pointer;
      transition: transform 0.14s, background 0.2s;
    }

    .entry-card:active { transform: scale(0.985); }

    .squircle {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #FFFFFF;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .sq-website { background: linear-gradient(135deg, #38BDF8, #2563EB); }
    .sq-switch  { background: linear-gradient(135deg, #2DD4BF, #0F766E); }
    .sq-windows { background: linear-gradient(135deg, #A78BFA, #6D28D9); }
    .sq-app     { background: linear-gradient(135deg, #FBBF24, #EA580C); }
    .sq-other   { background: linear-gradient(135deg, #F472B6, #DB2777); }

    .card-mid {
      min-width: 0;
      flex: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 7px;
      background: var(--accent-soft);
      color: var(--accent);
      flex-shrink: 0;
    }

    .card-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .fav-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      font-size: 17px;
      cursor: pointer;
      color: var(--text-muted);
      border-radius: 16px;
    }

    .fav-btn.on { color: #F59E0B; }

    .copy-mini {
      height: 30px;
      padding: 0 10px;
      border-radius: 15px;
      border: 1px solid var(--glass-border);
      background: var(--glass-card);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      padding: 52px 20px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
    }

    /* Bottom Action Bar for Export */
    .dirty-bar {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--warn-bg);
      border: 1px solid rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--warn-fg);
    }

    /* iOS Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(2, 6, 23, 0.56);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-card {
      width: 100%;
      max-width: 560px;
      max-height: 88dvh;
      overflow-y: auto;
      background: var(--sheet-bg);
      border: 1px solid var(--glass-border);
      border-top: 1.5px solid var(--glass-top);
      border-radius: 28px 28px 0 0;
      padding: 12px 18px calc(var(--safe-bottom) + 22px);
      transform: translateY(28px);
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sheet-backdrop.open .sheet-card {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 5px;
      border-radius: 999px;
      background: var(--text-muted);
      opacity: 0.45;
      margin: 0 auto 14px;
    }

    .detail-hero {
      text-align: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 14px;
    }

    .detail-hero .squircle {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      font-size: 26px;
      margin: 0 auto 10px;
    }

    .detail-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .detail-badges {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .detail-acts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .field-card {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 11px 13px;
      margin-bottom: 10px;
    }

    .field-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .field-card-lbl {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .field-card-val {
      font-size: 14px;
      word-break: break-all;
      line-height: 1.45;
    }

    .mono {
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }

    .mini-btns {
      display: flex;
      gap: 6px;
    }

    .mini-pill {
      height: 26px;
      padding: 0 10px;
      border-radius: 13px;
      border: 1px solid var(--glass-border);
      background: var(--glass-panel);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-pill.accent {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: transparent;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Dynamic Island Toast */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 12px);
      left: 50%;
      transform: translate(-50%, -20px);
      z-index: 90;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      color: #F8FAFC;
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.36);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>
  <div id="toast" class="toast"></div>

  <div class="app-shell">
    <!-- 1. UNLOCK SCREEN -->
    <section id="view-unlock" class="glass-panel unlock-wrap">
      <div class="brand-badge">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/>
          <path d="M9.5 12l2 2 3.5-4"/>
        </svg>
      </div>
      <h1 class="unlock-title">本地密码箱</h1>
      <div class="unlock-sub">iPhone 离线版 · 100% 兼容桌面 .enc 加密库</div>

      <label class="file-drop" id="file-drop-label" for="vault-file-input">
        <div class="file-drop-ico">🔐</div>
        <div class="file-drop-info">
          <div class="file-drop-name" id="file-drop-name">选择电脑导出的 .enc 密码库文件</div>
          <div class="file-drop-meta" id="file-drop-meta">支持 iCloud 云盘 / iPhone「文件」App（仅本地解密，不上传）</div>
        </div>
      </label>
      <input id="vault-file-input" type="file" accept=".enc,.json,*/*" class="hidden" />

      <div>
        <label class="field-label" for="unlock-pwd">主密码</label>
        <div class="input-row">
          <input id="unlock-pwd" type="password" class="glass-input" placeholder="输入对应账号的登录密码" autocomplete="current-password" />
          <button type="button" class="eye-btn" id="btn-toggle-unlock-pwd">显示</button>
        </div>
      </div>

      <div id="unlock-error" class="error-banner hidden"></div>

      <button type="button" class="btn-primary" id="btn-unlock">🔓 本地解密打开</button>

      <div class="unlock-actions">
        <button type="button" class="btn-secondary" id="btn-demo">✨ 体验演示库</button>
        <button type="button" class="btn-secondary" id="btn-new-vault">➕ 新建空白库</button>
      </div>

      <div class="tip-box">
        <strong>iPhone 使用小贴士：</strong>将电脑 <span class="mono">D:\Password Manager\Password\</span> 里的 <span class="mono">vault_用户名_xxx.enc</span> 存到 iCloud 云盘或「文件」中，选择后输入主密码即可查看与复制。在 Safari 点击底部分享按钮 →「添加到主屏幕」，可像原生 App 一样全屏打开。
      </div>
    </section>

    <!-- 2. MAIN VAULT SCREEN -->
    <section id="view-main" class="hidden">
      <header class="top-bar">
        <div class="top-brand">
          <div class="top-brand-ico">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/>
            </svg>
          </div>
          <div>
            <div class="top-title" id="main-owner-title">本地密码箱</div>
            <div class="top-meta" id="main-meta-sub">已解密 · 本地离线</div>
          </div>
        </div>
        <div class="top-btns">
          <button type="button" class="icon-btn" id="btn-export-enc" title="导出最新 .enc">💾</button>
          <button type="button" class="icon-btn" id="btn-theme" title="切换深浅色">🧊</button>
          <button type="button" class="icon-btn" id="btn-lock" title="立即锁定">🔒</button>
        </div>
      </header>

          );
          const aesKey = await window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          try {
            const buf = await window.crypto.subtle.decrypt(
              { name: "AES-GCM", iv: nonce, additionalData: aad, tagLength: 128 },
              aesKey,
              ct
            );
            ptBytes = new Uint8Array(buf);
          } catch (_) {
            throw new Error("主密码错误，无法解密该密码库。");
          }
        } else {
          const key = pbkdf2Sha256Js(ENC_UTF8.encode(password), salt, iterations);
          try {
            ptBytes = aesGcmJsCrypt(key, nonce, ct, aad, false);
          } catch (_) {
            throw new Error("主密码错误，无法解密该密码库。");
          }
        }
        return JSON.parse(DEC_UTF8.decode(ptBytes));
      }

      async function encryptVaultPayload(payload, password) {
        const version = 1;
        const iterations = 390000;
        const salt = randomBytes(16);
        const nonce = randomBytes(12);
        const aad = ENC_UTF8.encode("local-vault-v" + version);
        const ptBytes = ENC_UTF8.encode(JSON.stringify(payload));

        let ctBytes;
        if (window.crypto && window.crypto.subtle) {
          const baseKey = await window.crypto.subtle.importKey(
            "raw", ENC_UTF8.encode(password), "PBKDF2", false, ["deriveKey"]
          );
          const aesKey = await window.crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt"]
          );
          const buf = await window.crypto.subtle.encrypt(
            { name: "AES-GCM", iv: nonce, additionalData: aad, tagLength: 128 },
            aesKey,
            ptBytes
          );
          ctBytes = new Uint8Array(buf);
        } else {
          const key = pbkdf2Sha256Js(ENC_UTF8.encode(password), salt, iterations);
          ctBytes = aesGcmJsCrypt(key, nonce, ptBytes, aad, true);
        }

        return JSON.stringify({
          version: version,
          app_version: "v1.13.1-iPhone",
          kdf: "PBKDF2-HMAC-SHA256",
          iterations: iterations,
          salt: bytesToB64(salt),
          nonce: bytesToB64(nonce),
          ciphertext: bytesToB64(ctBytes)
        }, null, 2);
      }

      async function copyText(text, label) {
        if (!text) return;
        let ok = false;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            ok = true;
          }
        } catch (_) {}
        if (!ok) {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          try { ok = document.execCommand("copy"); } catch (_) {}
          document.body.removeChild(ta);
        }
        showToast(ok ? `已复制${label}` : "复制失败，请长按手动复制");
      }

      function formatAddress(e) {
        const t = e.entry_type || "website";
        if (t === "website") return e.url || "";
        if (t === "switch") {
          if (!e.host) return "";
          const hp = e.port ? `${e.host}:${e.port}` : e.host;
          return e.protocol ? `${hp} · ${e.protocol}` : hp;
        }
        if (t === "windows") return e.host ? (e.port ? `${e.host}:${e.port}` : e.host) : (e.domain || "");
        if (t === "app") return e.bind_info || e.category || "";
        if (t === "other") return e.host ? (e.port ? `${e.host}:${e.port}` : e.host) : (e.category || "");
        return "";
      }

      function buildCommand(e) {
        const t = e.entry_type || "website";
        const host = (e.host || "").trim();
        const port = (e.port || "").trim();
        const user = (e.username || "").trim();
        if (!host) return "";
        if (t === "switch") {
          const proto = (e.protocol || "SSH").toUpperCase();
          if (proto === "TELNET") return `telnet ${host}${port && port !== "23" ? " " + port : ""}`;
          if (proto === "WEB") return host.startsWith("http") ? host : `https://${host}${port && port !== "443" ? ":" + port : ""}`;
          if (proto === "SSH") return `ssh ${user ? user + "@" : ""}${host}${port && port !== "22" ? " -p " + port : ""}`;
          return "";
        }
        if (t === "windows") return `mstsc /v:${host}${port && port !== "3389" ? ":" + port : ""}`;
        if (t === "other") {
          const cat = (e.category || "").toLowerCase();
          if (cat.includes("mysql") || port === "3306") {
            return `mysql -h ${host} -P ${port || "3306"} -u ${user || "root"} -p`;
          }
          return `ssh ${user ? user + "@" : ""}${host}${port && port !== "22" ? " -p " + port : ""}`;
        }
        return "";
      }

      function passwordStrength(pwd) {
        if (!pwd) return { text: "", color: "" };
        let score = 0;
        if (pwd.length >= 8) score++;
        if (pwd.length >= 12) score++;
        if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
        if (/\d/.test(pwd)) score++;
        if (/[^A-Za-z0-9]/.test(pwd)) score++;
        if (score >= 4) return { text: "强", color: "#34D399" };
        if (score >= 3) return { text: "中", color: "#FBBF24" };
        return { text: "弱", color: "#F87171" };
      }

      function generateStrongPassword(len = 16) {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-";
        const r = randomBytes(len);
        let out = "";
        for (let i = 0; i < len; i++) out += chars[r[i] % chars.length];
        return out;
      }

          try {

            localStorage.setItem(STORAGE_KEY_NAME, state.fileName);

      async function doUnlock() {
        const errBox = $("unlock-error");
        errBox.classList.add("hidden");
        if (!state.rawEncText) {
          errBox.textContent = "请先点击上方区域选择你的 .enc 密码库文件（或点击「体验演示库」）。";
          errBox.classList.remove("hidden");

        const pwd = $("unlock-pwd").value;
        if (!pwd) {
          errBox.textContent = "请输入主密码。";
          errBox.classList.remove("hidden");
          return;
        }
        const btn = $("btn-unlock");
        btn.disabled = true;
        btn.textContent = "⏳ 正在本地 PBKDF2 派生密钥...";
        // Allow UI repaint before heavy KDF
        await new Promise((r) => setTimeout(r, 30));
        try {
          const payload = await decryptVaultEnvelope(state.rawEncText, pwd);
          state.password = pwd;
          state.payload = payload;
          state.entries = Array.isArray(payload.entries) ? payload.entries : [];
          state.isDemo = false;
          state.dirty = false;
          enterMainView();
        } catch (err) {
          errBox.textContent = err.message || "解密失败，请检查文件或密码。";
          errBox.classList.remove("hidden");
        } finally {
          btn.disabled = false;
          btn.textContent = "🔓 本地解密打开";
        }
      }

      function getFilteredEntries() {
        const kw = state.search.trim().toLowerCase();
        return state.entries
          .filter((e) => {
            if (state.filterType === "favorites" && e.is_favorite !== "1") return false;
            if (state.filterType !== "all" && state.filterType !== "favorites" && (e.entry_type || "website") !== state.filterType) return false;
            if (!kw) return true;
            const hay = [e.title, e.username, e.category, e.url, e.host, e.port, e.protocol, e.domain, e.bind_info, e.notes].join(" ").toLowerCase();
            return hay.includes(kw);
          })
          .sort((a, b) => {
            const fa = a.is_favorite === "1" ? 1 : 0;
            const fb = b.is_favorite === "1" ? 1 : 0;
            if (fa !== fb) return fb - fa;
            return String(b.updated_at || "").localeCompare(String(a.updated_at || ""));
          });
      }

      function renderPills() {
        const counts = { all: state.entries.length, favorites: 0, website: 0, switch: 0, windows: 0, app: 0, other: 0 };
        state.entries.forEach((e) => {
          if (e.is_favorite === "1") counts.favorites++;
          const t = e.entry_type || "website";
          counts[t] = (counts[t] || 0) + 1;
        });
        const defs = [
          ["all", "全部"],
          ["favorites", "⭐ 收藏"],
          ["website", "🌐 网站"],
          ["switch", "🖧 网络设备"],
          ["windows", "💻 Windows"],
          ["app", "📱 APP"],
          ["other", "🗂 其他"]

        strip.innerHTML = defs.map(([k, lbl]) => `

            ${lbl} <span>${counts[k] || 0}</span>
          </button>

        strip.querySelectorAll(".cat-pill").forEach((btn) => {
          btn.addEventListener("click", () => {

        const list = getFilteredEntries();

        el.innerHTML = list.map((e) => {
          const m = TYPE_META[e.entry_type] || TYPE_META.website;
          const addr = formatAddress(e);
          const subParts = [addr, e.username].filter(Boolean);
          const sub = subParts.join(" · ") || m.label;
          const fav = e.is_favorite === "1";
          return `
            <div class="entry-card" data-id="${escHtml(e.id)}">
              <div class="squircle ${m.sq}">${m.icon}</div>
              <div class="card-mid">
                <div class="card-top">

      function openDetail(id) {
        const e = state.entries.find((x) => x.id === id);
        if (!e) return;
        const m = TYPE_META[e.entry_type] || TYPE_META.website;
        const cmd = buildCommand(e);
        const isWebLink = (e.entry_type === "website" && e.url) || (e.entry_type === "switch" && (e.protocol || "").toUpperCase() === "WEB" && e.host);
        const openUrlTarget = e.entry_type === "website"
          ? (/^https?:\/\//i.test(e.url) ? e.url : "https://" + e.url)
          : cmd;

        let fieldsHtml = "";
        if (e.entry_type === "website") {
          fieldsHtml += fieldRowHtml("网站地址", e.url, e.url, "网址", true);
        } else if (e.entry_type === "switch") {
          const hp = e.host ? (e.port ? `${e.host}:${e.port}` : e.host) : "";
          fieldsHtml += fieldRowHtml(`IP 地址 / 主机 (${e.protocol || "SSH"})`, hp, e.host, "IP 地址", true);
          if (cmd) fieldsHtml += fieldRowHtml("连接命令", cmd, cmd, "连接命令", true);
        } else if (e.entry_type === "windows") {
          const hp = e.host ? (e.port ? `${e.host}:${e.port}` : e.host) : "";
          fieldsHtml += fieldRowHtml("IP / 计算机名", hp, e.host, "主机地址", true);
          fieldsHtml += fieldRowHtml("域 / 工作组", e.domain, e.domain, "域名", true);
          if (cmd) fieldsHtml += fieldRowHtml("远程桌面命令", cmd, cmd, "远程命令", true);
        } else if (e.entry_type === "app") {
          fieldsHtml += fieldRowHtml("绑定手机 / 邮箱", e.bind_info, e.bind_info, "绑定信息", true);
        } else {
          const hp = e.host ? (e.port ? `${e.host}:${e.port}` : e.host) : "";
          fieldsHtml += fieldRowHtml("主机 / IP 地址", hp, e.host, "主机地址", true);
          if (cmd) fieldsHtml += fieldRowHtml("连接命令", cmd, cmd, "连接命令", true);
        }

        fieldsHtml += fieldRowHtml("账号 / 用户名", e.username, e.username, "账号", true);
        fieldsHtml += secretRowHtml("pwd", "登录密码", e.password, "密码");
        if (e.entry_type === "switch") fieldsHtml += secretRowHtml("en", "Enable / 特权密码", e.enable_password, "特权密码");
        if (e.entry_type === "windows") fieldsHtml += secretRowHtml("pin", "PIN 码", e.pin_code, "PIN 码");
        fieldsHtml += fieldRowHtml("备注信息", e.notes, "", "", false);

        $("detail-content").innerHTML = `
          <div class="detail-hero">
            <div class="squircle ${m.sq}">${m.icon}</div>
            <h3 class="detail-title">${escHtml(e.title)}</h3>
            <div class="detail-badges">
              <span class="card-tag">${escHtml(m.label)}</span>
              ${e.category ? `<span class="card-tag" style="background:var(--glass-card);color:var(--text-secondary);">${escHtml(e.category)}</span>` : ""}
            </div>
            <div class="detail-acts">
              ${isWebLink ? `<a href="${escHtml(openUrlTarget)}" target="_blank" rel="noopener noreferrer" class="btn-secondary" style="text-decoration:none;background:var(--accent-btn);color:#fff;border-color:rgba(255,255,255,0.3);">🌐 打开网址</a>` : ""}
              ${cmd && !isWebLink ? `<button type="button" class="btn-secondary" style="background:var(--accent-btn);color:#fff;border-color:rgba(255,255,255,0.3);" id="dt-copy-cmd">📋 复制连接命令</button>` : ""}
              <button type="button" class="btn-secondary" id="dt-edit">编辑</button>
              <button type="button" class="btn-danger" id="dt-del">删除</button>
            </div>
          </div>
          ${fieldsHtml}
          <div style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:8px;">最后更新：${escHtml(e.updated_at || "-")}</div>
        `;

        const box = $("detail-content");
        box.querySelectorAll("[data-copy-val]").forEach((b) => {
          b.addEventListener("click", () => copyText(b.dataset.copyVal, b.dataset.copyLbl || "内容"));
        });
        box.querySelectorAll("[data-reveal]").forEach((b) => {
          b.addEventListener("click", () => {
            const v = $("sec-val-" + b.dataset.reveal);
            const shown = v.dataset.shown === "1";
            v.dataset.shown = shown ? "0" : "1";
            v.textContent = shown ? v.dataset.mask : v.dataset.raw;
            b.textContent = shown ? "显示" : "隐藏";
          });
        });
        const btnCmd = $("dt-copy-cmd");
        if (btnCmd) btnCmd.addEventListener("click", () => copyText(cmd, "连接命令"));
        $("dt-edit").addEventListener("click", () => {
          closeSheet($("detail-sheet"));
          openEditModal(e);
        });
        $("dt-del").addEventListener("click", () => {
          if ($("dt-del").dataset.confirm !== "1") {
            $("dt-del").dataset.confirm = "1";
            $("dt-del").textContent = "再点确认删除";
            return;
          }
          state.entries = state.entries.filter((x) => x.id !== e.id);
          state.dirty = true;
          closeSheet($("detail-sheet"));
          renderAll();
          showToast("已删除该条目");
        });

        $("detail-sheet").classList.add("open");
      }

      /* =====================================================================
       * 7. ADD / EDIT MODAL
       * ===================================================================== */
      function syncEditFieldVisibility() {
        const t = $("ed-type").value;
        $("wrap-url").classList.toggle("hidden", t !== "website");
        $("wrap-host").classList.toggle("hidden", t === "website" || t === "app");
        $("wrap-proto-port").classList.toggle("hidden", t === "website" || t === "app");
        $("wrap-proto").classList.toggle("hidden", t !== "switch");
        $("wrap-domain").classList.toggle("hidden", t !== "windows");
        $("wrap-bind").classList.toggle("hidden", t !== "app");
        $("wrap-enable").classList.toggle("hidden", t !== "switch");
        $("wrap-pin").classList.toggle("hidden", t !== "windows");
      }

      $("ed-type").addEventListener("change", syncEditFieldVisibility);

      function openEditModal(entry) {
        state.editingId = entry ? entry.id : null;
        $("edit-sheet-title").textContent = entry ? "编辑密码条目" : "新增密码条目";
        $("ed-type").value = (entry && entry.entry_type) || (state.filterType !== "all" && state.filterType !== "favorites" ? state.filterType : "website");
        $("ed-cat").value = (entry && entry.category) || "";
        $("ed-title").value = (entry && entry.title) || "";
        $("ed-url").value = (entry && entry.url) || "";
        $("ed-host").value = (entry && entry.host) || "";
        $("ed-proto").value = (entry && entry.protocol) || "SSH";
        $("ed-port").value = (entry && entry.port) || "";
        $("ed-domain").value = (entry && entry.domain) || "";
        $("ed-bind").value = (entry && entry.bind_info) || "";
        $("ed-user").value = (entry && entry.username) || "";
        $("ed-pwd").value = (entry && entry.password) || "";
        $("ed-enable").value = (entry && entry.enable_password) || "";
        $("ed-pin").value = (entry && entry.pin_code) || "";
        $("ed-notes").value = (entry && entry.notes) || "";
        syncEditFieldVisibility();
        $("edit-sheet").classList.add("open");
      }

      $("btn-add-entry").addEventListener("click", () => openEditModal(null));
      $("btn-edit-cancel").addEventListener("click", () => closeSheet($("edit-sheet")));
      $("edit-sheet").addEventListener("click", (e) => {
        if (e.target === $("edit-sheet")) closeSheet($("edit-sheet"));
      });
      $("btn-gen-pwd").addEventListener("click", () => {
        $("ed-pwd").value = generateStrongPassword(16);
        showToast("已生成 16 位随机强密码");
      });

      $("edit-form").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const title = $("ed-title").value.trim();
        if (!title) return;
        const ts = nowStr();
        const existing = state.editingId ? state.entries.find((x) => x.id === state.editingId) : null;
        const item = {
          id: existing ? existing.id : ("m_" + Date.now() + "_" + Math.random().toString(16).slice(2, 8)),
          owner_id: (state.payload && state.payload.owner_id) || "mobile",
          owner_name: (state.payload && state.payload.owner_name) || "user",
          access_level: (existing && existing.access_level) || "normal",
          entry_type: $("ed-type").value,
          title: title,
          category: $("ed-cat").value.trim() || TYPE_META[$("ed-type").value].short,
          username: $("ed-user").value.trim(),
          password: $("ed-pwd").value,
          url: $("ed-url").value.trim(),
          host: $("ed-host").value.trim(),
          port: $("ed-port").value.trim(),
          protocol: $("ed-type").value === "switch" ? $("ed-proto").value : "",
          enable_password: $("ed-enable").value,
          domain: $("ed-domain").value.trim(),
          pin_code: $("ed-pin").value,
          bind_info: $("ed-bind").value.trim(),
          is_favorite: existing ? (existing.is_favorite || "") : "",
          notes: $("ed-notes").value.trim(),
          created_at: existing ? (existing.created_at || ts) : ts,
          updated_at: ts
        };
        if (existing) {
          const idx = state.entries.findIndex((x) => x.id === existing.id);
          state.entries[idx] = item;
        } else {
          state.entries.unshift(item);
        }
        state.dirty = true;
        closeSheet($("edit-sheet"));
        renderAll();
        showToast(existing ? "已保存修改，记得导出 .enc" : "已添加条目，记得导出 .enc");
      });

      /* =====================================================================
       * 8. EXPORT .ENC (100% Compatible with Desktop) + AUTO-LOCK
       * ===================================================================== */
      async function exportEncFile() {
        if (!state.password || !state.payload) return;
        showToast("正在本地加密生成 .enc ...");
        await new Promise((r) => setTimeout(r, 30));
        try {
          const outPayload = {
            owner_id: state.payload.owner_id || "mobile",
            owner_name: state.payload.owner_name || "user",
            updated_at: nowStr(),
            entries: state.entries
          };
          const encText = await encryptVaultPayload(outPayload, state.password);
          state.rawEncText = encText;
          state.dirty = false;
          try {
            localStorage.setItem(STORAGE_KEY_ENC, encText);
            localStorage.setItem(STORAGE_KEY_NAME, state.fileName || "vault_export.enc");
          } catch (_) {}
          const blob = new Blob([encText], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = state.fileName || "vault_export.enc";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          renderList();
          showToast("已导出加密库文件，可直接放回电脑使用");
        } catch (err) {
          showToast("导出失败：" + (err.message || "未知错误"));
        }
      }

      $("btn-export-enc").addEventListener("click", exportEncFile);
      $("btn-dirty-export").addEventListener("click", exportEncFile);

      // 5-minute inactivity auto-lock
      ["touchstart", "click", "keydown"].forEach((evt) => {
        window.addEventListener(evt, () => { state.lastActive = Date.now(); }, { passive: true });
      });
      setInterval(() => {
        if (state.payload && Date.now() - state.lastActive > 5 * 60 * 1000) {
          lockVault();
          showToast("长时间无操作，已自动锁定");
        }
      }, 15000);

      // Initialize
      initTheme();
      loadCachedEnc();
    })();
  </script>
</body>
</html>
